[project]
name = "watchtower-platform"
version = "2.0.0.dev0"
description = "I/O adapters: Kafka, Postgres and S3 clients, config. The only place infrastructure libraries are imported."
authors = [
    { name = "emmanuelrichard01", email = "emma.moghalu@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
