[project]
name = "watchtower"
version = "2.0.0.dev0"
description = "Cold-chain risk decision platform (v2 rebuild workspace root)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "fastavro>=1.12.2",
    "hypothesis>=6.168.4",
    "pre-commit>=4",
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.pyright]
pythonVersion = "3.12"
include = ["packages", "tests"]
exclude = ["legacy", "**/.venv", "**/__pycache__"]
typeCheckingMode = "standard"
strict = ["packages/contracts", "packages/domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
